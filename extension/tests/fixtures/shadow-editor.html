<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shadow DOM editor fixture</title>
</head>
<body>
  <!-- Problem and editor both live inside an open shadow root, like some
       web-component based coding sites. -->
  <coding-widget></coding-widget>
  <script>
    customElements.define("coding-widget", class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `
          <section class="problem-statement">
            <h2>Description</h2>
            <p>Given an integer array nums, return true if any value appears at least twice in the array, and return false if every element is distinct.</p>
            <p>Example: Input: nums = [1,2,3,1]. Output: true. Constraints: 1 &lt;= nums.length &lt;= 10^5.</p>
          </section>
          <div contenteditable="true" style="font-family: monospace; min-height: 120px; width: 600px; white-space: pre">#include &lt;vector&gt;
using namespace std;
bool containsDuplicate(vector&lt;int&gt;&amp; nums) {
    for (int i = 0; i &lt; nums.size(); i++) {
    }
}</div>`;
      }
    });
  </script>
</body>
</html>
